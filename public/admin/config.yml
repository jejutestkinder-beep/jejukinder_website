backend:
  name: github
  repo: jejutestkinder-beep/jejukinder_website
  branch: main
  base_url: https://auth.jejutestkinder.workers.dev
  auth_endpoint: auth

locale: 'ko'

publish_mode: simple

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "notices"
    label: "공지사항"
    folder: "src/content/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{url_slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "URL 슬러그 (영어)", name: "url_slug", widget: "string", hint: "영문과 대시(-)만 사용하세요. 예: school-event-2026", required: true }
      - { label: "작성자", name: "author", widget: "string", required: true }
      - { label: "작성일", name: "date", widget: "datetime", required: true }
      - { label: "대표 이미지", name: "image", widget: "object", fields: [
          { label: "이미지 선택", name: "url", widget: "image", required: false },
          { label: "이미지 설명 (SEO/접근성용)", name: "alt", widget: "string", required: true, hint: "이미지에 대한 설명을 입력하세요 (필수)" }
        ]}
      - { label: "SEO 설정", name: "seo", widget: "object", collapsed: true, fields: [
          { label: "SEO 제목", name: "seo_title", widget: "string", required: false, hint: "검색 결과에 표시될 제목입니다. 미입력 시 본문 제목이 사용됩니다." },
          { label: "SEO 설명", name: "seo_description", widget: "text", required: false, hint: "검색 결과에 표시될 짧은 요약문입니다." },
          { label: "검색 키워드", name: "keywords", widget: "string", required: false, hint: "쉼표(,)로 구분하여 입력하세요. 예: 제주, 발도르프, 어린이집" }
        ]}
      - { label: "팝업으로 띄우기", name: "popup", widget: "boolean", default: false, hint: "⚠️ 주의: 최대 2개까지만 팝업으로 설정할 수 있습니다. 현재 활성화된 팝업이 2개 이상이면 선택할 수 없습니다." }
      - { label: "팝업 만료일", name: "popup_until", widget: "datetime", required: false, hint: "팝업을 자동으로 숨길 날짜를 설정하세요. 설정하지 않으면 무기한 표시됩니다." }
      - { label: "본문", name: "body", widget: "markdown" }

  - name: "board"
    label: "게시판"
    folder: "src/content/board"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{url_slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "URL 슬러그 (영어)", name: "url_slug", widget: "string", hint: "영문과 대시(-)만 사용하세요. 예: school-story-2026", required: true }
      - { label: "작성자", name: "author", widget: "string", required: true }
      - { label: "카테고리", name: "category", widget: "select", options: ["행사 안내", "학교 소식", "기타"], required: true }
      - { label: "작성일", name: "date", widget: "datetime" }
      - { label: "대표 이미지", name: "image", widget: "object", fields: [
          { label: "이미지 선택", name: "url", widget: "image", required: false },
          { label: "이미지 설명 (SEO/접근성용)", name: "alt", widget: "string", required: true, hint: "이미지에 대한 설명을 입력하세요 (필수)" }
        ]}
      - { label: "SEO 설정", name: "seo", widget: "object", collapsed: true, fields: [
          { label: "SEO 제목", name: "seo_title", widget: "string", required: false, hint: "검색 결과에 표시될 제목입니다. 미입력 시 본문 제목이 사용됩니다." },
          { label: "SEO 설명", name: "seo_description", widget: "text", required: false, hint: "검색 결과에 표시될 짧은 요약문입니다." },
          { label: "검색 키워드", name: "keywords", widget: "string", required: false, hint: "쉼표(,)로 구분하여 입력하세요. 예: 제주, 발도르프, 어린이집" }
        ]}
      - { label: "본문", name: "body", widget: "markdown" }

  - name: "testimonial"
    label: "어린이집 후기"
    folder: "src/content/testimonial"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{url_slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "URL 슬러그 (영어)", name: "url_slug", widget: "string", hint: "영문과 대시(-)만 사용하세요. 예: graduation-review", required: true }
      - { label: "작성자", name: "author", widget: "string", required: true, hint: "예: OOO 어머니, OOO 졸업생" }
      - { label: "작성일", name: "date", widget: "datetime", required: true }
      - { label: "대표 이미지", name: "image", widget: "object", fields: [
          { label: "이미지 선택", name: "url", widget: "image", required: false },
          { label: "이미지 설명 (SEO/접근성용)", name: "alt", widget: "string", required: true, hint: "이미지에 대한 설명을 입력하세요 (필수)" }
        ]}
      - { label: "SEO 설정", name: "seo", widget: "object", collapsed: true, fields: [
          { label: "SEO 제목", name: "seo_title", widget: "string", required: false, hint: "검색 결과에 표시될 제목입니다. 미입력 시 본문 제목이 사용됩니다." },
          { label: "SEO 설명", name: "seo_description", widget: "text", required: false, hint: "검색 결과에 표시될 짧은 요약문입니다." },
          { label: "검색 키워드", name: "keywords", widget: "string", required: false, hint: "쉼표(,)로 구분하여 입력하세요. 예: 제주, 발도르프, 어린이집" }
        ]}
      - { label: "본문", name: "body", widget: "markdown" }