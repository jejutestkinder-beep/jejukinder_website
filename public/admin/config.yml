# update admin panel config 
backend:
  name: github
  repo: jejutestkinder-beep/jejukinder_website
  branch: main
  base_url: https://auth.jejutestkinder.workers.dev
  auth_endpoint: auth

locale: 'ko'
publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "notices"
    label: "공지사항"
    folder: "src/content/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성자", name: "author", widget: "hidden", default: "제주 발도르프 어린이집" }
      - { label: "작성일", name: "date", widget: "hidden", default: "{{now}}" }
      - { label: "팝업으로 띄우기", name: "popup", widget: "boolean", default: false }
      - { label: "본문", name: "body", widget: "markdown" }
      - { label: "SEO 설명", name: "seo_description", widget: "text", required: false, hint: "검색 결과에 표시될 짧은 요약문입니다." }
      - { label: "검색 키워드", name: "keywords", widget: "string", required: false, hint: "쉼표(,)로 구분하여 입력하세요." }
      - { label: "대표 이미지", name: "image", widget: "image", required: false, hint: "목록에 보여질 이미지를 선택하세요." }

  - name: "board"
    label: "게시판"
    folder: "src/content/board"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "카테고리", name: "category", widget: "select", options: ["행사 안내", "학교 소식", "기타"], required: true }
      - { label: "작성자", name: "author", widget: "hidden", default: "제주 발도르프 어린이집" }
      - { label: "작성일", name: "date", widget: "hidden", default: "{{now}}" }
      - { label: "본문", name: "body", widget: "markdown" }
      - { label: "SEO 설명", name: "seo_description", widget: "text", required: false, hint: "검색 결과에 표시될 짧은 요약문입니다." }
      - { label: "검색 키워드", name: "keywords", widget: "string", required: false, hint: "쉼표(,)로 구분하여 입력하세요." }
      - { label: "대표 이미지", name: "image", widget: "image", required: false, hint: "목록에 보여질 이미지를 선택하세요." }

  - name: "testimonial"
    label: "어린이집 후기"
    folder: "src/content/testimonial"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작성자", name: "author", widget: "string", required: true, hint: "예: OOO 어머니, OOO 졸업생" }
      - { label: "작성일", name: "date", widget: "hidden", default: "{{now}}" }
      - { label: "본문", name: "body", widget: "markdown" }
      - { label: "SEO 설명", name: "seo_description", widget: "text", required: false, hint: "검색 결과에 표시될 짧은 요약문입니다." }
      - { label: "검색 키워드", name: "keywords", widget: "string", required: false, hint: "쉼표(,)로 구분하여 입력하세요." }
      - { label: "대표 이미지", name: "image", widget: "image", required: false, hint: "목록에 보여질 이미지를 선택하세요." }