<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
		<!-- Google Fonts for CMS Preview -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
		<title>Admin</title>
    <style>
      /* Netlify Identity 위젯 내의 이메일/비밀번호 입력 폼을 숨깁니다 */
      #netlify-identity-widget .netlify-identity-menu,
      #netlify-identity-widget .netlify-identity-form {
        display: none !important;
      }
      /* 대신 소셜 로그인(GitHub) 버튼 영역만 보이게 합니다 */
      #netlify-identity-widget .netlify-identity-providers {
        display: block !important;
        border: none !important;
      }

      /* 불필요한 게시 옵션 숨기기 */
      button[data-testid="publish-and-create-new-button"],
      button[data-testid="publish-and-duplicate-button"] {
        display: none !important;
      }
      
      /* 드롭다운 메뉴 아이템 숨기기 */
      ul[class*="DropdownButton-list"] li:not(:first-child) {
        display: none !important;
      }
      
      /* 프리뷰 컨테이너 스타일 */
      .preview-body {
        padding: 20px;
        font-family: sans-serif;
      }
    </style>
	</head>
	<body>
		<div id="nc-root"></div>

		<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

		<script>
			(function () {
				// GitHub OAuth code가 URL에 있으면 서버 사이드로 리다이렉트 (보안: 즉시 리다이렉트)
				const urlParams = new URLSearchParams(window.location.search);
				const code = urlParams.get('code');
				if (code && /^[a-zA-Z0-9_-]+$/.test(code) && code.length <= 200) {
					// 서버 사이드로 즉시 리다이렉트 (클라이언트에서 code 처리하지 않음)
					window.location.replace(`/.netlify/functions/auth?code=${encodeURIComponent(code)}`);
					return;
				}

				// Netlify Identity 위젯이 로드될 때까지 대기
				function waitForIdentity() {
					if (!window.netlifyIdentity) {
						setTimeout(waitForIdentity, 50);
						return;
					}

					const hash = window.location.hash || "";
					const hasToken =
						hash.includes("invite_token=") ||
						hash.includes("recovery_token=") ||
						hash.includes("confirmation_token=");

					if (!hasToken) return;

					// 토큰 처리
					function handleToken() {
						if (hash.includes("invite_token=") || hash.includes("recovery_token=")) {
							window.netlifyIdentity.open("signup");
						} else {
							window.netlifyIdentity.open();
						}
					}

					window.netlifyIdentity.on("init", handleToken);
					window.netlifyIdentity.init();

					// init이 이미 완료되었을 수 있으므로 한 번 더 확인
					setTimeout(handleToken, 100);
				}

				waitForIdentity();
			})();

			// 팝업 개수 제한 (최대 2개) - 경고만 표시
			(function() {
				const MAX_POPUPS = 2;
				
				function initPopupLimit() {
					// CMS가 완전히 로드될 때까지 대기
					if (typeof window.CMS === 'undefined') {
						setTimeout(initPopupLimit, 200);
						return;
					}

					// 팝업 필드 변경 시 경고만 표시
					setTimeout(function() {
						const observer = new MutationObserver(function(mutations) {
							const popupField = document.querySelector('input[name="popup"][type="checkbox"]');
							if (popupField && !popupField.dataset.listenerAdded) {
								popupField.dataset.listenerAdded = 'true';
								popupField.addEventListener('change', function(e) {
									if (e.target.checked) {
										// 경고 메시지만 표시 (실제 제한은 서버 사이드에서 처리)
										const confirmed = confirm('팝업은 최대 2개까지만 설정할 수 있습니다. 계속하시겠습니까?');
										if (!confirmed) {
											e.target.checked = false;
										}
									}
								});
							}
						});

						observer.observe(document.body, {
							childList: true,
							subtree: true
						});
					}, 2000);
				}

				initPopupLimit();
			})();

			// CMS 프리뷰 설정
			(function() {
				function initPreview() {
					if (typeof window.CMS === 'undefined') {
						setTimeout(initPreview, 200);
						return;
					}

					// 프리뷰 스타일 추가 (Tailwind CDN)
					window.CMS.registerPreviewStyle("https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css");

					// 공통 프리뷰 컴포넌트
					const Preview = ({ entry, widgetFor }) => {
						const data = entry.get('data').toJS();
						const title = data.title;
						const author = data.author;
						const date = data.date;
						const body = widgetFor('body');
						const imageUrl = data.image ? data.image.url : null;

						return h('div', { 
							className: 'p-8 max-w-4xl mx-auto bg-white',
							style: { fontFamily: "'Roboto', sans-serif", color: '#2B1111' }
						},
							// 실제 사이트 스타일을 적용하기 위한 스타일 태그
							h('style', {}, `
								.preview-content h1 { font-family: 'Gaegu', cursive; font-size: 3.5rem; color: #2B1111; font-weight: 700; margin-bottom: 2rem; line-height: 1.2; letter-spacing: -0.05em; }
								.preview-content h2 { font-family: 'Gaegu', cursive; font-size: 2.5rem; color: #674949; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.2; letter-spacing: -0.05em; }
								.preview-content h3 { font-family: 'Gaegu', cursive; font-size: 2rem; color: #674949; font-weight: 700; margin-bottom: 1rem; }
								.preview-content p { font-family: 'Roboto', sans-serif; font-size: 1.25rem; color: rgba(43, 17, 17, 0.8); line-height: 1.7; margin-bottom: 1.5rem; }
								.preview-content strong { color: #2B1111; font-weight: 700; }
								.preview-content a { color: #C64444; text-decoration: none; }
								.preview-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
								.preview-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1rem; }
								.preview-content li { margin-bottom: 0.5rem; color: #4B5563; }
								.preview-content blockquote { border-left: 4px solid #227A71; padding-left: 1rem; font-style: italic; color: #4B5563; margin-bottom: 1.5rem; }
								.preview-content img { border-radius: 0.5rem; margin-bottom: 1.5rem; }
							`),
							h('div', { className: 'preview-content' },
								imageUrl && h('img', { 
									src: imageUrl, 
									className: 'w-full h-64 object-cover rounded-lg mb-8 shadow-sm',
									style: { maxHeight: '400px' }
								}),
								h('h1', {}, title || '제목 없음'),
								h('div', { 
									className: 'mb-8 flex gap-6 pb-6 border-b border-[#D0CECE]',
									style: { color: '#6C6C6C', fontSize: '0.9rem' }
								},
									h('span', {}, `작성자: ${author || '미지정'}`),
									h('span', {}, `날짜: ${date ? new Date(date).toLocaleDateString('ko-KR') : '미지정'}`)
								),
								h('div', { className: 'prose-container' }, body)
							)
						);
					};

					window.CMS.registerPreviewTemplate("notices", Preview);
					window.CMS.registerPreviewTemplate("board", Preview);
					window.CMS.registerPreviewTemplate("testimonial", Preview);
				}

				initPreview();
			})();
		</script>
	</body>
</html>
